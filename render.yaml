services:
  - type: web
    name: random-coffee-app
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: redirect
        source: /ref/:code
        destination: /?ref=:code
      - type: rewrite
        source: /*
        destination: /index.html
